name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -q --cov --cov-report=term-missing

  integration:
    # Costs minutes: only on main, tags and manual runs, never on PRs.
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        odoo: ["15.0", "16.0", "17.0", "18.0", "19.0", "20.0"]
    env:
      ODOO_VERSION: ${{ matrix.odoo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group dev
      # Odoo 20 has no published image: build it from the pinned commit, with a layer cache
      # so only a new SHA pays for the pip install. start-odoo.sh reuses the loaded tag.
      - name: Read the pinned Odoo 20 commit
        if: matrix.odoo == '20.0'
        id: odoo20
        run: |
          sha="$(tr -d '[:space:]' < docker/odoo20/SHA)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tag=odoo-src:20.0-${sha:0:12}" >> "$GITHUB_OUTPUT"
      - if: matrix.odoo == '20.0'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Odoo 20 from source
        if: matrix.odoo == '20.0'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/odoo20
          build-args: ODOO_SHA=${{ steps.odoo20.outputs.sha }}
          tags: ${{ steps.odoo20.outputs.tag }}
          load: true
          push: false
          cache-from: type=gha,scope=odoo20
          cache-to: type=gha,mode=max,scope=odoo20
      - name: Start Odoo ${{ matrix.odoo }}
        run: scripts/start-odoo.sh
      - name: Run integration tests
        env:
          ODOO_URL: http://localhost:8069
          ODOO_DB: test
          ODOO_LOGIN: admin
          ODOO_API_KEY: admin
          ODOO_ALLOW_WRITES: "1"
        run: uv run pytest -m integration -q -o addopts=""
      - if: always()
        run: docker compose -f docker/odoo-compose.yml down -v

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group docs
      - run: uv run mkdocs build --strict
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          path: site
