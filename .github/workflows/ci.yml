name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -q

  integration:
    # Costs minutes: only on main, tags and manual runs, never on PRs.
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        odoo: ["17.0", "18.0", "19.0"]
    env:
      ODOO_VERSION: ${{ matrix.odoo }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Start Odoo ${{ matrix.odoo }}
        run: scripts/start-odoo.sh
      - name: Run integration tests
        env:
          ODOO_URL: http://localhost:8069
          ODOO_DB: test
          ODOO_LOGIN: admin
          ODOO_API_KEY: admin
          ODOO_ALLOW_WRITES: "1"
        run: uv run pytest -m integration -q -o addopts=""
      - if: always()
        run: docker compose -f docker/odoo-compose.yml down -v
