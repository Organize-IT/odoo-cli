site_name: odoo-agent-cli
site_description: Odoo JSON-RPC command line tool and Python client, built for AI agents and scripts.
repo_url: https://github.com/Organize-IT/odoo-cli
edit_uri: edit/main/docs/

exclude_docs: |
  superpowers/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: google

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Connections: getting-started/connections.md
  - Guides:
      - Output contract: guides/output-contract.md
      - Conditions: guides/conditions.md
      - Aliases and presets: guides/aliases.md
      - Field validation: guides/validation.md
      - Writing: guides/writes.md
      - For AI agents: guides/agents.md
  - Decisions:
      - Why a CLI returning Odoo JSON: decisions/0001-a-cli-that-returns-odoo-json.md
      - The output contract: decisions/0002-the-output-contract.md
      - Retries never replay a write: decisions/0003-retries-never-replay-a-write.md
      - Guards before the network: decisions/0004-guards-before-the-network.md
      - Validation never invents a refusal: decisions/0005-validation-never-invents-a-refusal.md
      - Aliases are sugar: decisions/0006-aliases-are-sugar.md
      - A repaired query is not a success: decisions/0007-a-repaired-query-is-not-a-success.md
  - Reference:
      - Commands: reference/commands.md
      - Python client: reference/client.md
      - Errors: reference/errors.md
